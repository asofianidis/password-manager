name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        name: Pick tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # Use package.json's version if it's ahead of the latest tag, otherwise bump the patch
            pkg="$(node -p "require('./package.json').version")"
            latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            latest="${latest#v}"
            if [[ -z "$latest" ]] || [[ "$(printf '%s\n%s\n' "$pkg" "$latest" | sort -V | tail -n1)" == "$pkg" && "$pkg" != "$latest" ]]; then
              tag="v$pkg"
            else
              IFS=. read -r major minor patch <<< "$latest"
              tag="v$major.$minor.$((patch + 1))"
            fi
          else
            tag=""
          fi
          echo "Resolved tag: ${tag:-<none>}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: --mac
          - name: Windows
            os: windows-latest
            platform: --win
          - name: Linux
            os: ubuntu-latest
            platform: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set version from tag
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Bundle with electron-vite
        run: npx electron-vite build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          # Builds are unsigned until signing secrets are configured (see README)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: password-manager-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish GitHub release
    if: needs.version.outputs.tag != ''
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Creates the tag at this commit if it doesn't exist yet
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
