name: Build

# Lints, tests and builds every push and pull request, and publishes a GitHub release for v* tags
# and for pushes to main that change an app.
#
# The jobs that sign (the macOS desktop build, the browser extension and the Android app) run in
# the protected "release" environment on release runs only. That environment may only be used
# from main and v* tags and waits for the maintainer's approval, and the signing secrets live
# there, so pull request builds never see them and nothing is published until the run is
# approved. The release job needs those jobs, so it waits too. See docs/RELEASING.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Decides what to build: the desktop app, the browser extension, the Android app, the iOS app,
  # or several.
  # Tag pushes and manual runs build everything; pushes and pull requests build only what their
  # changed files affect.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
      extension: ${{ steps.diff.outputs.extension }}
      android: ${{ steps.diff.outputs.android }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: Compare with the previous commit
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          everything() {
            echo "Building everything: $1"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "extension=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$GITHUB_REF" == refs/tags/* ]] && everything "tag push"
          case "$GITHUB_EVENT_NAME" in
            push) base="$BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
            *) everything "$GITHUB_EVENT_NAME run" ;;
          esac
          # New branches report an all-zero "before", and force pushes can drop it from history
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            everything "no earlier commit to compare with"
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          echo "Changed files:"
          echo "$files" | sed 's/^/  /'
          affects() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          # Dependencies and this workflow affect all of them (package.json holds the version)
          shared='^(package\.json|package-lock\.json|\.github/workflows/build\.yml)$'
          desktop="$(affects "$shared|^src/(main|preload|renderer|shared)/|^(build|resources)/|^electron-builder\.yml$|^electron\.vite\.config\.ts$|^tsconfig[^/]*\.json$")"
          extension="$(affects "$shared|^extension/|^scripts/(build|pack)-extension\.mjs$|^src/shared/browser-protocol\.ts$")"
          android="$(affects "$shared|^android/")"
          # The iOS tests read the desktop fixtures written for the Android tests
          ios="$(affects "$shared|^ios/|^android/app/src/test/resources/interop\.json$")"
          echo "Desktop app: $desktop, browser extension: $extension, Android app: $android, iOS app: $ios"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "extension=$extension" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Reads package-lock.json; accepted advisories and their reasons are listed in the script
      - run: node scripts/audit.mjs

  version:
    name: Resolve release version
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: resolve
        name: Pick tag
        shell: bash
        env:
          CHANGED: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.extension == 'true' || needs.changes.outputs.android == 'true' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$CHANGED" == true ]]; then
            # Use package.json's version if it's ahead of the latest tag, otherwise bump the patch
            pkg="$(node -p "require('./package.json').version")"
            latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            latest="${latest#v}"
            if [[ -z "$latest" ]] || [[ "$(printf '%s\n%s\n' "$pkg" "$latest" | sort -V | tail -n1)" == "$pkg" && "$pkg" != "$latest" ]]; then
              tag="v$pkg"
            else
              IFS=. read -r major minor patch <<< "$latest"
              tag="v$major.$minor.$((patch + 1))"
            fi
          else
            tag=""
          fi
          echo "Resolved tag: ${tag:-<none>}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [changes, check, audit, version]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    # Only the macOS build signs; an empty name means no environment
    environment: ${{ matrix.name == 'macOS' && needs.version.outputs.tag != '' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: --mac
          - name: Windows
            os: windows-latest
            platform: --win
          - name: Linux
            os: ubuntu-latest
            platform: --linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set version from tag
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Bundle with electron-vite
        run: npx electron-vite build

      # Shipped inside the app as the starting copy of the Chromium extension
      - name: Build browser extension
        run: npm run build:extension

      # The secrets only exist in the release environment, so pull requests, forks and other
      # non-release runs build an ad-hoc signed app. Only variables that are set are exported, and
      # the Apple credentials only as a complete set: electron-builder fails when APPLE_ID is set
      # without the password or team ID.
      - name: Configure code signing
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_if_set() {
            for name in "$@"; do
              if [[ -n "${!name}" ]]; then
                { echo "$name<<__SIGNING_EOF__"; echo "${!name}"; echo "__SIGNING_EOF__"; } >> "$GITHUB_ENV"
              fi
            done
          }
          if [[ -n "$CSC_LINK" ]]; then
            export_if_set CSC_LINK CSC_KEY_PASSWORD
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the Developer ID certificate in CSC_LINK" >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              export_if_set APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              echo "notarized=true" >> "$GITHUB_OUTPUT"
              echo "Notarizing with Apple" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::macOS build is signed but not notarized (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID missing)"
            fi
          else
            # Unsigned arm64 apps are reported as "damaged"; an ad-hoc signature avoids that.
            # Ad-hoc code can't pass library validation, so it runs without the hardened runtime.
            echo "args=-c.mac.identity=- -c.mac.hardenedRuntime=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS build is not code signed or notarized (CSC_LINK missing); building an ad-hoc signed app"
          fi

      # Signs and notarizes the apps when the variables above are set. A failed notarization fails
      # the build.
      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.platform }} --publish never ${{ steps.signing.outputs.args }}

      # electron-builder notarizes and staples the .app (so the zip that the updater and
      # install-mac.sh use is covered) and signs the .dmg around it, but doesn't notarize the
      # .dmg. Notarize and staple each one so Gatekeeper accepts a disk image downloaded in a
      # browser. This runs before the upload, so SHA256SUMS.txt covers the stapled files.
      - name: Notarize and staple the dmgs
        if: steps.signing.outputs.notarized == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [[ "${#dmgs[@]}" -ne 2 ]]; then
            echo "::error::Expected two .dmg files (x64 and arm64), found ${#dmgs[@]}"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            if ! codesign -dvv "$dmg" 2>&1 | grep -q "^Authority=Developer ID Application:"; then
              echo "::error::$dmg isn't signed with a Developer ID"
              exit 1
            fi
            # A first submission from a team can take an hour or more
            result="$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 2h --output-format json)"
            echo "$result"
            if [[ "$(jq -r .status <<< "$result")" != Accepted ]]; then
              xcrun notarytool log "$(jq -r .id <<< "$result")" --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              echo "::error::Notarization of $dmg failed"
              exit 1
            fi
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
            echo "Notarized and stapled $(basename "$dmg")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Verify macOS signatures
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          shopt -s nullglob
          apps=(dist/mac*/*.app)
          if [[ "${#apps[@]}" -ne 2 ]]; then
            echo "::error::Expected two apps (x64 and arm64), found ${#apps[@]}"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -E "^(Authority|TeamIdentifier|Timestamp|Runtime Version)="
            if [[ "$NOTARIZED" == true ]]; then
              xcrun stapler validate "$app"
              spctl -a -vvv -t exec "$app"
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: password-manager-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  extension:
    name: Build browser extension
    needs: [changes, check, audit, version]
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    # Releases sign the Firefox add-on
    environment: ${{ needs.version.outputs.tag != '' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set version from tag
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: npm run build:extension

      - run: npm run pack:extension

      # Mozilla only installs signed add-ons permanently. "unlisted" signs it without publishing it
      # on addons.mozilla.org. Each version can only be signed once, so this runs for releases only.
      # A failure here shouldn't block the desktop release; the unsigned zip is still attached.
      - name: Sign Firefox extension
        if: needs.version.outputs.tag != ''
        continue-on-error: true
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # A newline pasted into a secret breaks the JWT signature ("Error decoding signature")
          WEB_EXT_API_KEY="$(tr -d '[:space:]' <<< "$WEB_EXT_API_KEY")"
          WEB_EXT_API_SECRET="$(tr -d '[:space:]' <<< "$WEB_EXT_API_SECRET")"
          export WEB_EXT_API_KEY WEB_EXT_API_SECRET
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "::warning::AMO_JWT_ISSUER/AMO_JWT_SECRET not set; skipping Firefox signing"
            exit 0
          fi
          npx --yes web-ext@8 sign \
            --source-dir extension/dist/firefox \
            --channel unlisted \
            --artifacts-dir extension/signed
          mv extension/signed/*.xpi "extension/release/password-manager-extension-${TAG#v}-firefox.xpi"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: password-manager-extension
          if-no-files-found: error
          path: extension/release/*

  android:
    name: Build Android app
    needs: [changes, check, audit, version]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # Releases sign the APK with the release keystore
    environment: ${{ needs.version.outputs.tag != '' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The app's version comes from package.json
      - name: Set version from tag
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Test
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      # Android only installs an update signed with the same key as the installed app, so releases
      # need a fixed keystore: ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, and optionally ANDROID_KEY_PASSWORD. Only release runs read them; other
      # builds, and releases without them, get a debug APK signed with a throwaway key that can't
      # update an earlier install.
      - name: Build APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ needs.version.outputs.tag != '' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          PM_ANDROID_KEYSTORE_PASSWORD: ${{ needs.version.outputs.tag != '' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          PM_ANDROID_KEY_ALIAS: ${{ needs.version.outputs.tag != '' && secrets.ANDROID_KEY_ALIAS || '' }}
          PM_ANDROID_KEY_PASSWORD: ${{ needs.version.outputs.tag != '' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          version="$(node -p "require('../package.json').version")"
          mkdir -p release
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            export PM_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            base64 -d <<< "$KEYSTORE_BASE64" > "$PM_ANDROID_KEYSTORE"
            bash ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "release/password-manager-$version.apk"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; building a debug APK"
            bash ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "release/password-manager-$version-debug.apk"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: password-manager-android
          if-no-files-found: error
          path: android/release/*.apk

  # The iOS app is installed from Xcode (see README), so CI only tests and compiles it; nothing is
  # released. The build is unsigned: signing needs your own Apple team.
  ios:
    name: Build iOS app
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test core
        working-directory: ios/Core
        run: swift test

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen

      - name: Build app and AutoFill extension
        shell: bash
        run: |
          set -o pipefail
          version="$(node -p "require('./package.json').version")"
          xcodebuild build             -project ios/PasswordManager.xcodeproj             -scheme PasswordManager             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/derived"             CODE_SIGNING_ALLOWED=NO             MARKETING_VERSION="$version"             | grep -E '(error|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)|\*\*)' || true
          test -d "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Password Manager.app/PlugIns/AutoFill.appex"

  release:
    name: Publish GitHub release
    # Run when whichever builds were needed succeeded; a skipped build is fine
    if: >-
      always() && needs.version.outputs.tag != '' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, check, audit, version, build, extension, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build-provenance attestations
      id-token: write
      attestations: write
    steps:
      # Only the README is needed, for the macOS install instructions in the release notes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt . && cat SHA256SUMS.txt

      # Ties every file to this repository, workflow and commit: gh attestation verify <file>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*'

      # The release stays a draft until every file is uploaded, so installed apps and
      # install-mac.sh never see a half-uploaded release
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          EXTENSION: ${{ needs.changes.outputs.extension }}
          ANDROID: ${{ needs.changes.outputs.android }}
        run: |
          if [[ "$DESKTOP" == true ]]; then
            title="$TAG"
          else
            parts=()
            [[ "$EXTENSION" == true ]] && parts+=("browser extension")
            [[ "$ANDROID" == true ]] && parts+=("Android")
            title="$TAG ($(IFS=,; echo "${parts[*]}" | sed 's/,/, /g'))"
          fi
          # Releases with a Mac build start with the README's macOS install section; the generated
          # notes follow it
          : > notes.md
          if compgen -G 'artifacts/*.dmg' > /dev/null; then
            {
              echo '## Install on macOS'
              awk '/^### macOS$/ { found = 1; next } found && /^##?#? / { exit } found' README.md
              echo
            } > notes.md
          fi
          cat >> notes.md <<NOTES
          ## Verifying downloads

          Every file is listed in \`SHA256SUMS.txt\` and has a build-provenance attestation tying it to
          this repository and workflow run:

          \`\`\`sh
          shasum -a 256 -c SHA256SUMS.txt --ignore-missing
          gh attestation verify <file> --repo $GITHUB_REPOSITORY
          \`\`\`

          Built from $GITHUB_SHA.

          NOTES
          # A re-run replaces the draft an earlier attempt left behind
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file notes.md \
            --generate-notes
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n1)"
          if [[ -z "$id" ]]; then
            echo "::error::Couldn't find the draft release for $TAG"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
        run: |
          # The app's updater and install-mac.sh read the release marked Latest, so only a release
          # with desktop builds may take that spot. Other releases are published beside it.
          latest=false
          [[ "$DESKTOP" == true ]] && latest=true
          # Name the tag explicitly: publishing a draft without it can leave an "untagged-<hash>"
          # tag, which breaks the releases/download/<tag>/ URLs. Creates the tag at this commit if
          # it doesn't exist yet.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -F draft=false -f make_latest="$latest" --jq .html_url
          echo "Published $TAG (latest: $latest)" >> "$GITHUB_STEP_SUMMARY"

      # The app downloads Chromium extension updates from extension.json, and Firefox reads
      # updates.json (the add-on's update_url). Both live on a rolling pre-release, which never
      # becomes Latest, so they always point at the newest extension whatever else is released.
      - name: Update extension channel
        if: needs.extension.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          chrome="password-manager-extension-$version-chrome.zip"
          firefox="password-manager-extension-$version-firefox.xpi"
          sha256() { sha256sum "$1" | cut -d' ' -f1; }
          mkdir channel

          cp "artifacts/$chrome" channel/password-manager-extension-chrome.zip
          jq -n --arg version "$version" --arg url "$download/$chrome" --arg sha "$(sha256 "artifacts/$chrome")" \
            '{version: $version, chrome: {url: $url, sha256: $sha}}' > channel/extension.json

          # Signing can fail without failing the release; Firefox then keeps the previous version
          if [[ -f "artifacts/$firefox" ]]; then
            cp "artifacts/$firefox" channel/password-manager-extension-firefox.xpi
            jq -n --arg version "$version" --arg url "$download/$firefox" --arg sha "$(sha256 "artifacts/$firefox")" \
              '{addons: {"password-manager@asofianidis": {updates: [{version: $version, update_link: $url, update_hash: ("sha256:" + $sha)}]}}}' \
              > channel/updates.json
          fi

          if ! gh release view extension-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create extension-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Browser extension (latest)" \
              --notes "Update feed for the browser extension. Download installers from the versioned releases."
          fi
          gh release upload extension-latest channel/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit extension-latest --repo "$GITHUB_REPOSITORY" \
            --notes "Update feed for the browser extension. Currently $TAG; see that release for details."
