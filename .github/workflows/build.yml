name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Decides what to build: the desktop app, the browser extension, or both. Tag pushes and manual
  # runs build everything; pushes and pull requests build only what their changed files affect.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
      extension: ${{ steps.diff.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Compare with the previous commit
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          everything() {
            echo "Building everything: $1"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "extension=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$GITHUB_REF" == refs/tags/* ]] && everything "tag push"
          case "$GITHUB_EVENT_NAME" in
            push) base="$BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
            *) everything "$GITHUB_EVENT_NAME run" ;;
          esac
          # New branches report an all-zero "before", and force pushes can drop it from history
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            everything "no earlier commit to compare with"
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          echo "Changed files:"
          echo "$files" | sed 's/^/  /'
          affects() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          # Dependencies and this workflow affect both
          shared='^(package\.json|package-lock\.json|\.github/workflows/build\.yml)$'
          desktop="$(affects "$shared|^src/(main|preload|renderer|shared)/|^(build|resources)/|^electron-builder\.yml$|^electron\.vite\.config\.ts$|^tsconfig[^/]*\.json$")"
          extension="$(affects "$shared|^extension/|^scripts/(build|pack)-extension\.mjs$|^src/shared/browser-protocol\.ts$")"
          echo "Desktop app: $desktop, browser extension: $extension"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "extension=$extension" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  version:
    name: Resolve release version
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        name: Pick tag
        shell: bash
        env:
          CHANGED: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.extension == 'true' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$CHANGED" == true ]]; then
            # Use package.json's version if it's ahead of the latest tag, otherwise bump the patch
            pkg="$(node -p "require('./package.json').version")"
            latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            latest="${latest#v}"
            if [[ -z "$latest" ]] || [[ "$(printf '%s\n%s\n' "$pkg" "$latest" | sort -V | tail -n1)" == "$pkg" && "$pkg" != "$latest" ]]; then
              tag="v$pkg"
            else
              IFS=. read -r major minor patch <<< "$latest"
              tag="v$major.$minor.$((patch + 1))"
            fi
          else
            tag=""
          fi
          echo "Resolved tag: ${tag:-<none>}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [changes, check, version]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: --mac
          - name: Windows
            os: windows-latest
            platform: --win
          - name: Linux
            os: ubuntu-latest
            platform: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set version from tag
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Bundle with electron-vite
        run: npx electron-vite build

      # Shipped inside the app as the starting copy of the Chromium extension
      - name: Build browser extension
        run: npm run build:extension

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          # Builds are unsigned until signing secrets are configured (see README)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: password-manager-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  extension:
    name: Build browser extension
    needs: [changes, check, version]
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set version from tag
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: npm run build:extension

      - run: npm run pack:extension

      # Mozilla only installs signed add-ons permanently. "unlisted" signs it without publishing it
      # on addons.mozilla.org. Each version can only be signed once, so this runs for releases only.
      # A failure here shouldn't block the desktop release; the unsigned zip is still attached.
      - name: Sign Firefox extension
        if: needs.version.outputs.tag != ''
        continue-on-error: true
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # A newline pasted into a secret breaks the JWT signature ("Error decoding signature")
          WEB_EXT_API_KEY="$(tr -d '[:space:]' <<< "$WEB_EXT_API_KEY")"
          WEB_EXT_API_SECRET="$(tr -d '[:space:]' <<< "$WEB_EXT_API_SECRET")"
          export WEB_EXT_API_KEY WEB_EXT_API_SECRET
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "::warning::AMO_JWT_ISSUER/AMO_JWT_SECRET not set; skipping Firefox signing"
            exit 0
          fi
          npx --yes web-ext@8 sign \
            --source-dir extension/dist/firefox \
            --channel unlisted \
            --artifacts-dir extension/signed
          mv extension/signed/*.xpi "extension/release/password-manager-extension-${TAG#v}-firefox.xpi"

      - uses: actions/upload-artifact@v4
        with:
          name: password-manager-extension
          if-no-files-found: error
          path: extension/release/*

  release:
    name: Publish GitHub release
    # Run when whichever builds were needed succeeded; a skipped build is fine
    if: >-
      always() && needs.version.outputs.tag != '' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, check, version, build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the README is needed, for the macOS install instructions in the release notes
      - uses: actions/checkout@v4
        with:
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
        run: |
          # The app's updater and install-mac.sh read the release marked Latest, so only a release
          # with desktop builds may take that spot. Extension-only releases are published beside it.
          if [[ "$DESKTOP" == true ]]; then
            latest=true
            title="$TAG"
          else
            latest=false
            title="$TAG (browser extension)"
          fi
          # Releases with a Mac build start with the README's macOS install section; the generated
          # notes follow it
          : > notes.md
          if compgen -G 'artifacts/*.dmg' > /dev/null; then
            {
              echo '## Install on macOS'
              awk '/^### macOS$/ { found = 1; next } found && /^##?#? / { exit } found' README.md
              echo
            } > notes.md
          fi
          # Creates the tag at this commit if it doesn't exist yet
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --latest="$latest" \
            --notes-file notes.md \
            --generate-notes

      # The app downloads Chromium extension updates from extension.json, and Firefox reads
      # updates.json (the add-on's update_url). Both live on a rolling pre-release, which never
      # becomes Latest, so they always point at the newest extension whatever else is released.
      - name: Update extension channel
        if: needs.extension.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          chrome="password-manager-extension-$version-chrome.zip"
          firefox="password-manager-extension-$version-firefox.xpi"
          sha256() { sha256sum "$1" | cut -d' ' -f1; }
          mkdir channel

          cp "artifacts/$chrome" channel/password-manager-extension-chrome.zip
          jq -n --arg version "$version" --arg url "$download/$chrome" --arg sha "$(sha256 "artifacts/$chrome")" \
            '{version: $version, chrome: {url: $url, sha256: $sha}}' > channel/extension.json

          # Signing can fail without failing the release; Firefox then keeps the previous version
          if [[ -f "artifacts/$firefox" ]]; then
            cp "artifacts/$firefox" channel/password-manager-extension-firefox.xpi
            jq -n --arg version "$version" --arg url "$download/$firefox" --arg sha "$(sha256 "artifacts/$firefox")" \
              '{addons: {"password-manager@asofianidis": {updates: [{version: $version, update_link: $url, update_hash: ("sha256:" + $sha)}]}}}' \
              > channel/updates.json
          fi

          if ! gh release view extension-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create extension-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Browser extension (latest)" \
              --notes "Update feed for the browser extension. Download installers from the versioned releases."
          fi
          gh release upload extension-latest channel/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit extension-latest --repo "$GITHUB_REPOSITORY" \
            --notes "Update feed for the browser extension. Currently $TAG; see that release for details."
