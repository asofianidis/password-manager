version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        # Patch and minor bumps arrive as one PR; majors stay separate
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
        # Below 1.0 a minor bump can break things (esbuild 0.25 → 0.28, react-refresh 0.4 → 0.5),
        # so these arrive as separate PRs
        exclude-patterns:
          - '@types/chrome'
          - esbuild
          - eslint-plugin-react-refresh
          - fflate
          - prettier-plugin-tailwindcss
