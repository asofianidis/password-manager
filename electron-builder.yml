appId: com.password-manager
productName: Password Manager
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!src/*'
  - '!test/*'
  - '!docs/*'
  - '!extension/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# The Chromium extension, copied by the app into the folder users load it from (extension-files.ts)
extraResources:
  - from: extension/dist/chrome
    to: browser-extension/chrome
win:
  executableName: password-manager
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc sign when no Developer ID is configured. Unsigned arm64 apps are reported as "damaged"
  # by Gatekeeper; an ad-hoc signature lets users allow the app via Privacy & Security instead.
  identity: '-'
  extendInfo:
    # Without this, macOS 15+ silently blocks connections to other devices on the network (sync
    # fails with EHOSTUNREACH) instead of asking the user for Local Network access
    NSLocalNetworkUsageDescription: Password Manager syncs your vault directly with your other devices on this network.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: asofianidis
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# Releases are uploaded by the GitHub workflow (builds run with --publish never). This config only
# tells electron-builder to write the latest*.yml feeds and app-update.yml that the updater reads.
publish:
  provider: github
  owner: asofianidis
  repo: password-manager
